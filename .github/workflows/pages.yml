# Publishes this repository as a static site, which is where the SaveForge editor loads its pictures from
# (https://noxxionmurph.github.io/SaveHub-assets/sprites/...). Needs Settings > Pages > Source: "GitHub Actions".
name: Publish the artwork

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
